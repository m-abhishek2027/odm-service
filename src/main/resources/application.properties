spring.application.name=odm-service

# Cloud Run passes the port to listen on in $PORT
server.port=${PORT:8080}

# MySQL database connection
# note: spring-cloud-gcp's CloudSqlEnvironmentPostProcessor builds the effective URL from spring.cloud.gcp.sql.*
spring.datasource.url=jdbc:mysql:///${DB_NAME:scorecard}?socketFactory=com.google.cloud.sql.mysql.SocketFactory&cloudSqlInstance=oreilly-470714:us-central1:scorecard-metadata
spring.cloud.gcp.sql.database-name=${DB_NAME:scorecard}
spring.cloud.gcp.sql.instance-connection-name=oreilly-470714:us-central1:scorecard-metadata
spring.datasource.username=${DB_USER:scorecard-md}
spring.datasource.password=${DB_PASS}
# connections per instance; keep (max instances x pool size) below the Cloud SQL connection limit
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
# logging every SQL statement floods Cloud Run logs; enable locally with JPA_SHOW_SQL=true
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
# release the DB connection when the service method returns instead of holding it while the response is written;
# services load the lazy collections before returning
spring.jpa.open-in-view=false
# load lazy collections (languages, brands, ...) for up to 500 assets (the max page size) in one IN query each
spring.jpa.properties.hibernate.default_batch_fetch_size=500

# create missing DB indexes on startup (see DatabaseIndexManager)
odm.db.indexes.auto-create=true

# send inserts in JDBC batches (bucket import writes thousands of rows)
# set as a driver property: spring-cloud-gcp's CloudSqlEnvironmentPostProcessor rebuilds spring.datasource.url
# from spring.cloud.gcp.sql.* and drops any parameters added to the URL
spring.datasource.hikari.data-source-properties.rewriteBatchedStatements=true
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true

# Google Cloud Storage import (POST /api/v1/admin/import/gcs)
spring.cloud.gcp.project-id=oreilly-470714
odm.import.gcs.bucket=oreilly-dam-staging
odm.import.gcs.prefix=products/
